      - "https://openai.com/blog/rss/"
      - "https://ai.googleblog.com/feeds/posts/default"
      - "https://huggingface.co/blog/feed.xml"
      - "https://medium.com/feed/tag/large-language-models"
      - "https://medium.com/feed/tag/llm"
      - "https://cohere.com/blog"             # allowlist HTML crawl
      - "https://weaviate.io/blog"            # allowlist HTML crawl
      - "https://milvus.io/blog"              # allowlist HTML crawl
      - "https://blog.langchain.dev"          # allowlist HTML crawl
      # extra sources
      - "https://www.anthropic.com/research"
      - "https://ai.facebook.com/blog/"
      - "https://www.microsoft.com/en-us/research/blog/topics/artificial-intelligence/"
      - "https://developer.nvidia.com/blog/category/ai-data-science/generative-ai/"
      - "https://www.databricks.com/blog/category/ai"
      # additional sources
      - "https://deepmind.com/blog/rss.xml"
      - "https://www.mosaicml.com/blog/feed.xml"
      - "https://thegradient.pub/feed.xml"
      - "https://www.techmeme.com/feed.xml"

  - name: "RAG"
    keywords: ["retrieval-augmented generation", "RAG", "retrieval", "document retrieval", "vector database", "embedding", "semantic search", "vector search", "knowledge base", "information retrieval", "search", "indexing", "similarity", "neural search"]
    seed_urls:
      - "https://arxiv.org/rss/cs.IR"
      - "https://ai.meta.com/blog/rss/"
      - "https://medium.com/feed/tag/rag"
      - "https://medium.com/feed/tag/retrieval-augmented-generation"
      - "https://huggingface.co/blog/feed.xml"
      - "https://weaviate.io/blog/rss.xml"
      - "https://blog.langchain.dev/rss/"
      - "https://www.pinecone.io/learn"       # allowlist HTML crawl
      - "https://cohere.com/blog"             # allowlist HTML crawl
      # extra sources
      - "https://qdrant.tech/articles/"
      - "https://www.pinecone.io/blog/"
      - "https://redis.io/blog/"
      - "https://blog.vespa.ai/"
      - "https://zilliz.com/blog"

  - name: "MCP"
    description: "Model Context Protocol"
    keywords: ["model context protocol", "MCP", "model serving", "model deployment", "MLOps", "machine learning operations", "model inference", "model hosting", "API", "serving", "deployment", "production", "infrastructure", "scaling", "monitoring"]
    seed_urls:
      - "https://mlops.community/feed/"
      - "https://huyenchip.com/feed.xml"
      - "https://medium.com/feed/tag/mlops"
      # extra sources
      - "https://www.bentoml.com/blog"
      - "https://modal.com/blog"
      - "https://fly.io/blog/"
      - "https://www.ray.io/blog"
      # additional sources
      - "https://www.seldon.io/blog/"           # allowlist HTML crawl
