  - name: "Quantum Computing"
    keywords: ["quantum computing", "qubit", "quantum algorithm", "quantum supremacy", "quantum hardware", "quantum", "quantum mechanics", "quantum physics", "quantum information", "quantum simulation", "quantum advantage", "quantum error correction", "quantum annealing", "quantum machine learning"]
