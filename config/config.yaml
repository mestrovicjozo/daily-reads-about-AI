# Reddit settings (optional)
reddit:
  days_back: 3
  subreddits_per_topic:
    LLMs: ["MachineLearning", "LocalLLaMA", "LanguageTechnology", "OpenAI", "ChatGPT", "ArtificialInteligence", "deeplearning"]
    RAG: ["Rag", "LanguageTechnology", "langchain", "weaviate", "milvus", "pineconeio", "vectorsearch"]
    MCP: ["mcp", "MLOps", "devops", "kubernetes", "docker"]
    Quantum Computing: ["QuantumComputing", "Quantum", "Qiskit", "IBMQuantum"]

# Crawler settings
crawler:
  user_agent: "Mozilla/5.0 (compatible; DigestAgent/1.0; +https://github.com/yourusername/digest-agent)"
  request_timeout: 10  # seconds
  max_retries: 3
  rate_limit_delay: 1.0  # seconds between requests to the same domain
  max_articles_per_topic: 100

# Processing settings
processing:
  min_article_length: 300  # characters (reduced from 500)
  max_article_length: 20000  # characters
  summary_length: 5  # sentences
  language: "en"
  dedupe_threshold: 0.9  # Jaccard similarity threshold
  max_age_hours: 72      # primary freshness window (3 days for more flexible coverage)
  history_days: 30      # cross-day dedupe horizon; skip items seen in last N days
  fallback_window_days: 7  # secondary freshness window; skip items seen in last N days if history_days is exceeded
  per_topic_month_fallback: true   # if a topic is underfilled after 7 days, extend to N days (below)
  per_topic_month_fallback_days: 30
  use_ai_validation: false  # Set to true to enable AI-powered article validation
  routing:
    enabled: true
    model_name: "sentence-transformers/all-MiniLM-L6-v2"
    confidence_margin: 0.08
    force_override_if_best_differs: true

# Ranking weights
ranking:
  recency: 0.4
  relevance: 0.3
  authoritativeness: 0.2
  engagement: 0.1

# Output settings
output:
  digest_dir: "digests"
  provenance_dir: "provenance"
  date_format: "%Y-%m-%d"
  max_articles_per_topic: 3

# API Keys (to be set in environment variables)
apis:
  openai_api_key: ${OPENAI_API_KEY}  # For summarization if needed
  google_search_api_key: ${GOOGLE_SEARCH_API_KEY}
  google_search_engine_id: ${GOOGLE_SEARCH_ENGINE_ID}
  reddit_client_id: ${REDDIT_CLIENT_ID}        # optional, for Reddit
  reddit_client_secret: ${REDDIT_CLIENT_SECRET} # optional
  reddit_user_agent: ${REDDIT_USER_AGENT}       # optional
