name: Daily Tech Digest

on:
  schedule:
    # Runs at 06:00 UTC daily (08:00 in Central Europe during DST)
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write  # required to push the generated files

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from repository secrets
        run: |
          echo "REDDIT_CLIENT_ID=${{ secrets.REDDIT_CLIENT_ID }}" >> .env
          echo "REDDIT_CLIENT_SECRET=${{ secrets.REDDIT_CLIENT_SECRET }}" >> .env
          echo "REDDIT_USER_AGENT=${{ secrets.REDDIT_USER_AGENT }}" >> .env

      - name: Generate digest
        env:
          TZ: UTC
        run: |
          DATE=$(date -u +%F)
          echo "Generating for $DATE"
          python run.py generate --date $DATE

      - name: Validate digest
        env:
          TZ: UTC
        run: |
          DATE=$(date -u +%F)
          python run.py validate digests/$DATE.md

      - name: Commit and push results
        run: |
          DATE=$(date -u +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/ provenance/
          git commit -m "chore(digest): $DATE" || echo "No changes to commit"
          git push
